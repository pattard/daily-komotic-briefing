name: Daily Komotic Briefing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first. Test sends now. Send-edition requires NEWSLETTER_ENABLED=true."
        required: true
        default: preview
        type: choice
        options:
          - preview
          - send-test
          - check-sources
          - send-edition
          - arm-monitor
  schedule:
    - cron: '13,43 7 * * 1-5'
      timezone: Europe/Madrid

permissions:
  contents: read

concurrency:
  # One shared lock for scheduled runs, manual previews, tests and recovery.
  group: daily-komotic-briefing
  cancel-in-progress: false

jobs:
  briefing:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'schedule' || vars.NEWSLETTER_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run briefing
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          NEWSLETTER_TIMEZONE: ${{ vars.NEWSLETTER_TIMEZONE }}
          NEWSLETTER_SEND_TIME: ${{ vars.NEWSLETTER_SEND_TIME }}
          NEWSLETTER_ENABLED: ${{ vars.NEWSLETTER_ENABLED }}
        run: python -m briefing "$RUN_MODE"
      - name: Signal a production failure
        if: >-
          failure() && vars.NEWSLETTER_ENABLED == 'true' &&
          (github.event_name == 'schedule' || inputs.mode == 'send-edition')
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: python -m briefing.healthcheck --fail
      - name: Save newsletter and source report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: briefing-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
